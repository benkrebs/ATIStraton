name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  lint-and-test:
    name: Lint und Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Abhängigkeiten installieren
        run: pip install --quiet pytest pytest-asyncio ruff homeassistant

      - name: Ruff
        run: ruff check custom_components tests

      - name: Formatierung
        run: ruff format --check custom_components tests

      - name: Tests
        run: pytest tests/ -q

  validate:
    name: Home Assistant und HACS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: hassfest
        uses: home-assistant/actions/hassfest@master

      - name: HACS
        uses: hacs/action@main
        with:
          category: integration
