name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  lint-and-test:
    name: Lint und Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Abhängigkeiten installieren
        run: pip install --quiet -r requirements-dev.txt

      - name: Ruff
        run: ruff check custom_components tests

      - name: Formatierung
        run: ruff format --check custom_components tests

      - name: Tests
        run: pytest tests/ -q

  validate:
    name: Home Assistant und HACS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: hassfest
        uses: home-assistant/actions/hassfest@master

      - name: HACS
        uses: hacs/action@main
        with:
          category: integration
          # Die Brands-Prüfung verlangt Markenlogos im
          # home-assistant/brands-Repository. Das wären die Marken von ATI, und
          # deren Verwendung widerspräche der ausdrücklichen Feststellung, dass
          # dieses Projekt nicht mit dem Hersteller verbunden ist. Sie ist nur
          # für die Aufnahme in den HACS-Standardkatalog erforderlich; als
          # benutzerdefiniertes Repository lässt sich die Integration ohne sie
          # installieren.
          ignore: brands
